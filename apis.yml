name: Vivid
description: 'Vivid Money is a European fintech company operating a mobile-first financial
  super-app for individuals and businesses across the EU. Through its regulated entities
  Vivid Money S.A. (payments/e-money) and Vivid Money B.V. (investments), it offers
  business and personal accounts, physical and virtual cards, SEPA and card payments,
  cashback rewards, savings/interest pockets, stock and ETF investing, and crypto
  services. For businesses it adds expense management, sub-accounts, and open-banking
  connectivity to accounting tools such as DATEV, sevDesk, Lexware Office, FastBill,
  and Agicap. Vivid is backed by SoftBank Vision Fund. As of this profile Vivid does
  not publish a public developer API, developer portal, or SDKs; its ''open banking''
  is consumer-consent connectivity to third-party financial apps rather than an
  outbound public API surface.'
